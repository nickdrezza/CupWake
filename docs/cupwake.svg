  <text x="54" y="155" font-family="system-ui, sans-serif" font-size="25" fill="#57534d">One cup. One click.</text>
  <text x="54" y="213" font-family="system-ui, sans-serif" font-size="16" fill="#57534d">A small macOS menu-bar switch for caffeinate.</text>

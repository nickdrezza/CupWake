<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">CupWake. One cup. One click.</title>
  <desc id="desc">An empty cup means Off. A full cup with steam means On.</desc>
